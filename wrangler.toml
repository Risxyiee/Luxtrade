name = "luxtrade"
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat", "streams_enable_constructors"]

# Prevent wrangler from overriding dashboard environment variables
keep_vars = true

# OpenNext Cloudflare configuration — custom entry wraps worker.js with scheduled() cron handler
main = "worker-entry.ts"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# ─── Cloudflare Bindings ─────────────────────────────────────────────────────

# KV Namespace — shared cache across Worker isolates
[[kv_namespaces]]
binding = "luxtradee_kv"
id = "4d16786ba51a4c22b42b1af7b97e3bd6"

# R2 Bucket — DISABLED (error 10042, not provisioned)
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "luxtradee-uploads"

# Cloudflare Images
[images]
binding = "IMAGES"

# Workers AI — LLM, embeddings, image classification
[ai]
binding = "ai_luxtrade"

# CPU limits removed — not supported on Free plan (error 100328)
# [limits]
# cpu_ms = 30000

# Browser Rendering (for PDF generation, server-side screenshots)
[browser]
binding = "ai_run"

# Queue Producer — background jobs
[[queues.producers]]
binding = "queue"
queue = "luxtradee"

# Vectorize Index — semantic search for trade journals
# Uncomment after creating the index:
# wrangler vectorize create "luxtradee-journals" --dimensions=768 --metric=cosine
# [[vectorize]]
# binding = "VECTORIZE_INDEX"
# index_name = "luxtradee-journals"

# ══════════════════════════════════════════════════════════════════════════════
# Environment Variables
# ══════════════════════════════════════════════════════════════════════════════
# NEXT_PUBLIC_* vars are client-safe and go in [vars] below.
# Server-side secrets MUST be set via `wrangler secret put <NAME>`.
#   NEVER put empty strings for secrets in [vars] — that overrides the
#   secret with an empty value, making it inaccessible.
# ══════════════════════════════════════════════════════════════════════════════

[vars]
