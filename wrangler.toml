name = "luxtrade"
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat", "streams_enable_constructors"]

# Prevent wrangler from overriding dashboard environment variables
keep_vars = true

# OpenNext Cloudflare configuration
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# ─── Cloudflare Bindings ─────────────────────────────────────────────────────

# KV Namespace — shared cache across Worker isolates
[[kv_namespaces]]
binding = "luxtradee_kv"
id = "4d16786ba51a4c22b42b1af7b97e3bd6"

# R2 Bucket — file uploads (trade screenshots, testimonials)
[[r2_buckets]]
binding = "R2"
bucket_name = "luxtradee-uploads"

# Cloudflare Images
[images]
binding = "IMAGES"

# Workers AI — LLM, embeddings, image classification
[ai]
binding = "ai_luxtrade"

# Rate Limiting
[limits]
cpu_ms = 30000

# Browser Rendering (for PDF generation, server-side screenshots)
[browser]
binding = "ai_run"

# Queue Producer — background jobs
[[queues.producers]]
binding = "queue"
queue = "luxtradee"

# Vectorize Index — semantic search for trade journals
# Uncomment after creating the index:
# wrangler vectorize create "luxtradee-journals" --dimensions=768 --metric=cosine
# [[vectorize]]
# binding = "VECTORIZE_INDEX"
# index_name = "luxtradee-journals"

# secret environment variables
[vars]
NEXT_PUBLIC_SUPABASE_URL = "https://klxkdrfsfcoankbaoejn.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtseGtkcmZzZmNvYW5rYmFvZWpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAzNzY0MTAsImV4cCI6MjA4NTk1MjQxMH0.4Yv9JesMXWEy4phu2D-Yw9rkbq0l8z9kz-sRwFZerQ0"
NEXT_PUBLIC_SITE_URL = "https://luxtradee.web.id"
MIDTRANS_IS_PRODUCTION = "true"

# Observability
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

# Cron triggers
[triggers]
crons = [
  "0 1 * * *",    # daily-reminder  (08:00 WIB)
  "0 3 * * *",    # re-engage + downgrade-expired-pro (10:00 WIB)
  "0 3 * * 1",    # weekly-summary  (10:00 WIB, Mondays only)
]
