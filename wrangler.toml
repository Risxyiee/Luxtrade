name = "luxtrade"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "streams_enable_constructors"]

# Prevent wrangler from overriding dashboard environment variables
keep_vars = true

# OpenNext Cloudflare configuration
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Cloudflare Images binding
[images]
binding = "IMAGES"

# secret environment variables
[vars]
NEXT_PUBLIC_SUPABASE_URL = "https://klxkdrfsfcoankbaoejn.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "REDACTED-DEAD-KEY"
NEXT_PUBLIC_SITE_URL = "https://luxtradee.web.id"
MIDTRANS_IS_PRODUCTION = "true"

# Observability
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

# Cron triggers (migrated from vercel.json)
# Cloudflare Workers crons invoke the worker's scheduled() handler.
# The OpenNext adapter routes cron requests to the matching API path.
# All times in UTC.
[triggers]
crons = [
  "0 1 * * *",    # daily-reminder  (08:00 WIB)
  "0 3 * * *",    # re-engage + downgrade-expired-pro (10:00 WIB)
  "0 3 * * 1",    # weekly-summary  (10:00 WIB, Mondays only)
]