name: Deploy to Cloudflare Workers (MANUAL — fallback)

# ══════════════════════════════════════════════════════════════════════════
# ⚠️ DEPLOY UTAMA SEKARANG = CLOUDFLARE WORKERS BUILDS (dashboard CF ↔ GitHub).
#    Setiap push ke main otomatis di-build & deploy oleh CF — bukti hidup:
#    commit 6f09f4ac sudah produksi tanpa workflow ini.
#
#    Workflow ini TIDAK lagi jalan otomatis (trigger push dihapus) karena:
#    1. Dobel deploy (Workers Builds + Actions) rawan race condition.
#    2. CLOUDFLARE_API_TOKEN secret kosong (Bos tidak ingin pakai token di
#       GitHub) → tiap push selalu merah X padahal deploy asli sukses.
#
#    Pakai tombol "Run workflow" HANYA sebagai cadangan kalau Workers Builds
#    bermasalah — dan itu butuh secrets:
#      CLOUDFLARE_API_TOKEN   (template "Edit Cloudflare Workers" + Images/AI/Browser/Queues)
#      CLOUDFLARE_ACCOUNT_ID  (a0365e485e4970191d6332a023ea9783)
#
#    Config deploy = wrangler.jsonc (SINGLE SOURCE OF TRUTH — wrangler.toml
#    dihapus + masuk .gitignore; JANGAN buat lagi).
# ══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://klxkdrfsfcoankbaoejn.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_gYf7ekooCy36EmIv8_PKzw_ixj0zKhE"
      NEXT_PUBLIC_SITE_URL: "https://luxtradee.web.id"
      NEXT_PUBLIC_APP_URL: "https://luxtradee.web.id"
      NEXT_PUBLIC_BASE_URL: "https://luxtradee.web.id"
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: "BNTL6FFlfUygscRgM-1grOaHx57xsGDB2Vad_rZ1oOdeW6rLtrCLqr8AOcZf5Cp0gC5cobm8NvfvCpIV5QUHCYI"
      VAPID_SUBJECT: "mailto:support@luxtradee.web.id"
      MIDTRANS_IS_PRODUCTION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (OpenNext → Cloudflare)
        run: bun run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
