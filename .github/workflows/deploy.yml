name: Deploy to Cloudflare Workers

# ══════════════════════════════════════════════════════════════════════════
# CI/CD — build OpenNext + deploy ke CF Workers "luxtradee"
#
# Trigger:
#   - push ke main  → auto deploy produksi
#   - workflow_dispatch (tombol "Run workflow" di GitHub app/web)
#
# Secrets repo yang wajib ada (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   (template "Edit Cloudflare Workers" + Images/AI/Browser/Queues)
#   CLOUDFLARE_ACCOUNT_ID  (a0365e485e4970191d6332a023ea9783)
#
# Catatan:
#   - Config deploy = wrangler.jsonc (SINGLE SOURCE OF TRUTH — wrangler.toml
#     sudah dihapus permanen; jangan buat lagi).
#   - NEXT_PUBLIC_* di bawah di-inline saat build (client bundle). Nilainya
#     public by design (anon key publishable + VAPID public).
#   - Secret server (SERVICE_ROLE dsb) TIDAK disentuh workflow ini —
#     tetap aman di CF dashboard.
# ══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://klxkdrfsfcoankbaoejn.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_gYf7ekooCy36EmIv8_PKzw_ixj0zKhE"
      NEXT_PUBLIC_SITE_URL: "https://luxtradee.web.id"
      NEXT_PUBLIC_APP_URL: "https://luxtradee.web.id"
      NEXT_PUBLIC_BASE_URL: "https://luxtradee.web.id"
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: "BNTL6FFlfUygscRgM-1grOaHx57xsGDB2Vad_rZ1oOdeW6rLtrCLqr8AOcZf5Cp0gC5cobm8NvfvCpIV5QUHCYI"
      VAPID_SUBJECT: "mailto:support@luxtradee.web.id"
      MIDTRANS_IS_PRODUCTION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (OpenNext → Cloudflare)
        run: bun run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
