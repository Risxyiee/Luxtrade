name: Master Autonomous Workforce

# ============================================================
# 🏢 MASTER CRON — Fully Autonomous AI Workforce (8 agen, MODE GELUMBANG)
# ------------------------------------------------------------
# CF Workers gratis = MAKS 50 SUBREQUEST per invokasi. Run penuh 8 agen
# (13 probe Raka + rantai LLM + DB + Discord) bisa melampaui batas itu →
# "Too many subrequests" (terjadi 2026-11-02: Farhan & Discord gagal).
#
# Solusi: endpoint sama dipanggil 3× TERPISAH (tiap invokasi dapat budget
# subrequest baru). Hasil tiap gelombang disimpan di agent_kv, lalu
# Alexander (gelombang terakhir) fan-in dari sana:
#   Wave 1: Raka (security sweep) + Maya + Bagas + Putri + Dewi
#   Wave 2: Farhan (artikel SEO) + Sinta (draf TikTok)  [LLM berat]
#   Wave 3: Alexander → Morning Briefing → Discord
#
# Catatan limit: CF Workers Free = maks 5 cron triggers dan semua
# sudah terpakai — makanya master cron ini dipicu dari GitHub Actions.
#
# SETUP SEKALI (wajib, oleh Bos):
#   GitHub repo → Settings → Secrets and variables → Actions:
#     PROD_URL        = https://luxtradee.web.id
#     CRON_SECRET     = string acak (SAMakan dengan env CRON_SECRET
#                       di Cloudflare Workers — SATU nama saja)
#   Cloudflare Dashboard → Workers → luxtradee → Settings →
#     Variables & Secrets → CRON_SECRET = string yang sama
#
# Uji manual: jalankan workflow ini manual (workflow_dispatch) atau:
#   curl -X POST -H "Authorization: Bearer $SECRET" \
#     "https://luxtradee.web.id/api/cron/master-autonomous?agents=raka,maya,bagas,putri,dewi"
# ============================================================

on:
  schedule:
    # 0 1 * * * UTC = 08.00 WIB (jam kerja kantor) — harian
    - cron: '0 1 * * *'
  workflow_dispatch: {}

concurrency:
  group: master-autonomous
  cancel-in-progress: false

jobs:
  run-workforce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: "🏢 Gelombang 1/3 — Raka (sweep) + agen data"
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          PROD_URL="${PROD_URL%/}"
          if [ -z "$PROD_URL" ]; then echo "❌ Secret PROD_URL belum diset"; exit 1; fi
          if [ -z "$CRON_SECRET" ]; then echo "❌ Secret CRON_SECRET belum diset"; exit 1; fi
          kick () {
            local qs="$1" label="$2"
            echo "🚀 $label → $PROD_URL/api/cron/master-autonomous$qs"
            local code
            code=$(curl -sS -L -o /tmp/wave-resp.json -w '%{http_code}' \
              --max-time 900 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -H "User-Agent: luxtradee-master-autonomous-cron" \
              "$PROD_URL/api/cron/master-autonomous$qs") || code=000
            echo "HTTP $code"
            head -c 16000 /tmp/wave-resp.json 2>/dev/null || true
            echo ""
            if command -v jq >/dev/null 2>&1; then
              echo "── AGEN GAGAL ──"
              jq -r '(.agents // {}) | to_entries[] | select(.value.status == "error") | "- \(.key): \(.value.error // "tanpa pesan")"' /tmp/wave-resp.json 2>/dev/null || true
              echo "── RAKA P1 (celah keamanan) ──"
              jq -r '(.agents.Raka.data.p1 // [])[] | "- \(.method) \(.path): \(.note)"' /tmp/wave-resp.json 2>/dev/null || true
            fi
            grep -q '"success": *true' /tmp/wave-resp.json 2>/dev/null || {
              echo "❌ $label gagal (HTTP $code) — cek body di atas"
              exit 1
            }
            echo "✅ $label selesai"
          }
          kick "?agents=raka,maya,bagas,putri,dewi" "Gelombang 1: Raka + agen data"

      - name: "🎬 Gelombang 2/3 — Farhan + Sinta (konten LLM berat)"
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          PROD_URL="${PROD_URL%/}"
          if [ -z "$PROD_URL" ]; then echo "❌ Secret PROD_URL belum diset"; exit 1; fi
          if [ -z "$CRON_SECRET" ]; then echo "❌ Secret CRON_SECRET belum diset"; exit 1; fi
          kick () {
            local qs="$1" label="$2"
            echo "🚀 $label → $PROD_URL/api/cron/master-autonomous$qs"
            local code
            code=$(curl -sS -L -o /tmp/wave-resp.json -w '%{http_code}' \
              --max-time 900 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -H "User-Agent: luxtradee-master-autonomous-cron" \
              "$PROD_URL/api/cron/master-autonomous$qs") || code=000
            echo "HTTP $code"
            head -c 16000 /tmp/wave-resp.json 2>/dev/null || true
            echo ""
            if command -v jq >/dev/null 2>&1; then
              echo "── AGEN GAGAL ──"
              jq -r '(.agents // {}) | to_entries[] | select(.value.status == "error") | "- \(.key): \(.value.error // "tanpa pesan")"' /tmp/wave-resp.json 2>/dev/null || true
            fi
            grep -q '"success": *true' /tmp/wave-resp.json 2>/dev/null || {
              echo "❌ $label gagal (HTTP $code) — cek body di atas"
              exit 1
            }
            echo "✅ $label selesai"
          }
          # force=true: guard interval 30 menit memblok wave ke-2 dalam run yang
          # sama (wave 1 baru saja mencatat master:lastRun) — aman, tetap ber-auth.
          kick "?agents=farhan,sinta&force=true" "Gelombang 2: Farhan + Sinta"

      - name: "👔 Gelombang 3/3 — Alexander (briefing → Discord)"
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          PROD_URL="${PROD_URL%/}"
          if [ -z "$PROD_URL" ]; then echo "❌ Secret PROD_URL belum diset"; exit 1; fi
          if [ -z "$CRON_SECRET" ]; then echo "❌ Secret CRON_SECRET belum diset"; exit 1; fi
          kick () {
            local qs="$1" label="$2"
            echo "🚀 $label → $PROD_URL/api/cron/master-autonomous$qs"
            local code
            code=$(curl -sS -L -o /tmp/wave-resp.json -w '%{http_code}' \
              --max-time 900 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              -H "User-Agent: luxtradee-master-autonomous-cron" \
              "$PROD_URL/api/cron/master-autonomous$qs") || code=000
            echo "HTTP $code"
            head -c 16000 /tmp/wave-resp.json 2>/dev/null || true
            echo ""
            if command -v jq >/dev/null 2>&1; then
              echo "── RINGKASAN BRIEFING ──"
              jq -r '.ceo.briefing.ringkasan // "tidak ada"' /tmp/wave-resp.json 2>/dev/null || true
              jq -r '"NBA: \(.ceo.briefing.next_best_action.judul // "-")"' /tmp/wave-resp.json 2>/dev/null || true
            fi
            grep -q '"success": *true' /tmp/wave-resp.json 2>/dev/null || {
              echo "❌ $label gagal (HTTP $code) — cek body di atas"
              exit 1
            }
            # Hardening: wave 3 WAJIB menghasilkan briefing — kalau ceo null,
            # berarti worker belum deploy versi mode gelombang.
            jq -e '.ceo != null and .ceo.briefing.ringkasan != null' /tmp/wave-resp.json >/dev/null 2>&1 || {
              echo "❌ Alexander tidak menghasilkan briefing (ceo null — worker belum di-deploy dengan kode mode gelombang?)"
              exit 1
            }
            echo "✅ $label selesai"
          }
          # Alexander solo: muat hasil wave 1+2 dari agent_kv (mode gelombang)
          kick "?agents=alexander&force=true" "Gelombang 3: Alexander fan-in"
          echo ""
          echo "✅ Workforce selesai — briefing terkirim ke Discord"
