name: TestSprite - Visual Testing

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to test (default: luxtradee.web.id)'
        required: false
        default: 'https://luxtradee.web.id'

jobs:
  testsprite:
    name: Run TestSprite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run TestSprite
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
          TEST_URL: ${{ github.event.inputs.url || 'https://luxtradee.web.id' }}
        run: |
          echo "========================================"
          echo "🔍 TestSprite - LuxTrade Website Testing"
          echo "========================================"
          echo "URL: $TEST_URL"
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""

          npm install -g @anthropic-ai/claude-code@latest 2>/dev/null || true

          echo '{"mcpServers":{"TestSprite":{"command":"npx","args":["-y","@testsprite/testsprite-mcp@latest"],"env":{"API_KEY":"'"$TESTSPRITE_API_KEY"'"}}}}' > mcp_config.json

          npx -y @anthropic-ai/claude-code@latest \
            -p "Use the TestSprite MCP tool to run a full visual test on $TEST_URL. Report all errors, broken elements, and visual issues found." \
            --mcp-config mcp_config.json \
            --output-format json 2>&1 | tee testsprite-results.json || true

          echo ""
          echo "========================================"
          echo "📋 Done"
          echo "========================================"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testsprite-results-${{ github.sha }}
          path: testsprite-results.json
          retention-days: 30
