name: Pine Alerts Runner

# ============================================================
# Alert Pine otomatis 24 jam (Task 44) — ARSITEKTUR BARU
# ------------------------------------------------------------
# FIX "alert pine user tidak jalan di produksi": engine PineTS
# memakai `new Function` (code generation) yang DILARANG runtime
# Cloudflare Workers (workerd) → EvalError → semua grup alert
# gagal senyap di produksi. Solusi: engine dieksekusi DI SINI
# (GitHub Actions runner = Node penuh, eval diizinkan).
#
# Tiap 5 menit:
#   1. GET  {PROD_URL}/api/cron/pine-alerts/payload  → paket grup
#      (sumber skrip + candle server + users + watermark)
#   2. scripts/pine-alerts-engine.ts menjalankan engine PineTS
#      + collectTriggers (jendela catch-up)
#   3. POST {PROD_URL}/api/cron/pine-alerts/report → server
#      melakukan dedupe per-bar + push layar HP user Pro
#
# Cron Cloudflare */15 (worker-entry.ts → /api/cron/pine-alerts)
# tetap jalan sebagai BACKUP (grup ditandai engineDeferred di
# workerd — dedupe pine_alert_log mencegah kirim ganda).
#
# SETUP SEKALI (wajib, oleh Bos):
#   GitHub repo → Settings → Secrets and variables → Actions:
#     PROD_URL               = https://luxtradee.web.id
#     PINE_ALERT_CRON_SECRET = string acak (SAMakan dengan env
#                              PINE_ALERT_CRON_SECRET di Cloudflare)
#   Cloudflare Dashboard → Workers → Settings → Variables:
#     PINE_ALERT_CRON_SECRET = string acak yang sama
#
# Tanpa secret yang cocok, endpoint menolak (403) — aman.
# ============================================================

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: pine-alerts-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install engine deps (vela-pinets + tsx)
        run: npm install --no-save --no-audit --no-fund @luxalgo/vela-pinets@^0.3.0 tsx@^4

      - name: Run Pine engine & report triggers
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          PINE_ALERT_CRON_SECRET: ${{ secrets.PINE_ALERT_CRON_SECRET }}
        run: npx tsx scripts/pine-alerts-engine.ts
