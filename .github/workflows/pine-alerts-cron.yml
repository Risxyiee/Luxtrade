name: Pine Alerts Runner

# ============================================================
# Alert Pine otomatis 24 jam (Task 44)
# ------------------------------------------------------------
# Tiap 5 menit server mengecek sinyal Entry/SL/TP dari skrip
# terproteksi untuk SEMUA langganan aktif → Telegram user Pro.
# User tak perlu buka chart — alert tetap jalan.
#
# SETUP SEKALI (wajib, oleh Bos):
#   GitHub repo → Settings → Secrets and variables → Actions:
#     PROD_URL               = https://luxtradee.web.id
#     PINE_ALERT_CRON_SECRET = string acak (SAMakan dengan env
#                              PINE_ALERT_CRON_SECRET di Cloudflare)
#   Cloudflare Dashboard → Workers → Settings → Variables:
#     PINE_ALERT_CRON_SECRET = string acak yang sama
#
# Tanpa secret yang cocok, endpoint menolak (403) — aman.
# ============================================================

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: pine-alerts-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Panggil /api/cron/pine-alerts
        run: |
          # HARDENING: secret PROD_URL lama berisi trailing slash → URL
          # //api/... → Cloudflare 308 → endpoint TIDAK tereksekusi tapi
          # workflow dulu tetap "hijau" (silent fail). Sekarang: strip slash,
          # follow redirect (-L), dan 308/4xx/5xx = GAGAL keras.
          PROD_URL="${{ secrets.PROD_URL }}"
          PROD_URL="${PROD_URL%/}"
          code=$(curl -sS -L -o /tmp/pine-alerts.json -w '%{http_code}' -X POST \
            -H "x-cron-secret: ${{ secrets.PINE_ALERT_CRON_SECRET }}" \
            -H "User-Agent: luxtradee-pine-alerts-cron" \
            --max-time 280 \
            "${PROD_URL}/api/cron/pine-alerts") || code=000
          echo "HTTP $code"
          head -c 2000 /tmp/pine-alerts.json 2>/dev/null || true
          echo ""
          case "$code" in
            2*) echo "✅ Pine alerts tereksekusi (HTTP $code)" ;;
            *) echo "::error::Pine alerts GAGAL (HTTP $code) — endpoint tidak tereksekusi, dicek ulang 5 menit berikutnya"; exit 1 ;;
          esac
