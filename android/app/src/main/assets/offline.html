<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - LuxTradee</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 400px; }
        .icon { font-size: 64px; margin-bottom: 24px; }
        h1 { font-size: 24px; margin-bottom: 12px; color: #FFD700; }
        p { font-size: 16px; color: #94a3b8; margin-bottom: 32px; line-height: 1.5; }
        .retry-btn {
            background: #FFD700;
            color: #0f172a;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .retry-btn:hover { background: #e6c200; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>Kamu Sedang Offline</h1>
        <p>Cek koneksi internet kamu dan coba lagi. Data dashboard terakhir masih tersimpan di cache.</p>
        <button class="retry-btn" onclick="window.location.href='/dashboard'">Coba Lagi</button>
    </div>
</body>
</html>
